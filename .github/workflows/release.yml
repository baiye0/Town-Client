name: Build paired client release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TOWN_UPDATE_REPOSITORY: ${{ vars.TOWN_UPDATE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify native Windows credential and task registration
        if: runner.os == 'Windows'
        env:
          TOWN_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/background-native.test.ts
      - name: Validate tag matches client version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - run: cargo test --manifest-path heart-portal/Cargo.toml --locked -- --test-threads=1
      - run: npm run build:portal
      - name: Verify native Windows service upgrade and rollback
        if: runner.os == 'Windows'
        env:
          TOWN_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/runtime-update-native.test.ts
      - run: npm run make
      - name: Verify Windows installer launches the new client
        if: runner.os == 'Windows'
        env:
          TOWN_NATIVE_INSTALLER_TESTS: '1'
        run: npx vitest run tests/manual-installer-native.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: Town-Client-${{ matrix.os }}
          path: |
            out/make/
            resources/runtime-bundle.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate both packages and stage checksums
        run: node scripts/stage-release.mjs artifacts release "$(node -p 'require("./package.json").version')"
      - name: Publish the complete paired release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Town-Client $GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
# Manual workflow runs only build and test. A version tag publishes after both
# native builds pass; the release stays a draft if asset upload fails.
